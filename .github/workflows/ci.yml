name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit -p tsconfig.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Same script Vercel runs inside `npm run build`, invoked separately so a
      # type error reads as a typecheck failure rather than a build failure.
      # One definition, so CI and the deploy cannot drift apart — which is how
      # TS1484 sat red on main for days while every deploy went out green.
      - run: npm run typecheck
      # Tests carry Node types, so they are a separate project. CI checks them;
      # the deploy gate above deliberately does not.
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
