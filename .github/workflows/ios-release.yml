name: iOS Release

# Builds the iOS app, signs it for the App Store and uploads it to App Store
# Connect, where it appears in TestFlight once Apple has processed it.
#
# Signing is managed by Xcode through an App Store Connect API key, so there
# are no certificates or provisioning profiles to export and store. Required
# repository secrets — see mobile/RELEASE.md:
#   APP_STORE_CONNECT_KEY_ID      the key's ID, e.g. 2X9R4HXF34
#   APP_STORE_CONNECT_ISSUER_ID   the issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY         the full text of the downloaded AuthKey_….p8
#   APPLE_TEAM_ID                 the 10-character team ID from the developer account
#
# Manual only: each upload needs a build number App Store Connect has not
# seen for this version, and it uses the account's signing certificate.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number — must be higher than any build already uploaded for this version. Leave blank to use pubspec.'
        required: false
        type: string
      build_name:
        description: 'Version shown to users, e.g. 1.1.0. Leave blank to use pubspec.'
        required: false
        type: string
      api_base_url:
        description: 'API base URL to compile in. Leave blank to use the API_BASE_URL repository variable.'
        required: false
        type: string

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check the App Store Connect secrets are configured
        working-directory: .
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEY_ID:-}" ]    || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "${ISSUER_ID:-}" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "${KEY:-}" ]       || missing="$missing APP_STORE_CONNECT_KEY"
          [ -n "${TEAM_ID:-}" ]   || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions. See mobile/RELEASE.md."
            exit 1
          fi
          echo "All four App Store Connect secrets are present."

      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Outside the workspace, so no later step can archive it with the checkout.
      - name: Stage the API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$KEY" > "$keyfile"
          grep -q 'BEGIN PRIVATE KEY' "$keyfile" || { echo "::error::APP_STORE_CONNECT_KEY is not the text of a .p8 key"; exit 1; }
          echo "KEY_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "API key staged (contents not logged)."

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # Inputs go through env, never into the script text.
      - name: Build the Flutter app for iOS
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NAME: ${{ inputs.build_name }}
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          args=()
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::No API base URL. Set the API_BASE_URL repository variable, or pass api_base_url to this workflow."
            exit 1
          fi
          case "$API_BASE_URL" in https://*) ;; *) echo "::error::API_BASE_URL must start with https://"; exit 1 ;; esac
          echo "Building against $API_BASE_URL"
          args+=("--dart-define=KIPL_API_BASE_URL=$API_BASE_URL")
          if [ -n "${BUILD_NUMBER:-}" ]; then
            case "$BUILD_NUMBER" in ''|*[!0-9]*) echo "::error::build_number must be a positive integer"; exit 1 ;; esac
            args+=("--build-number=$BUILD_NUMBER")
          fi
          if [ -n "${BUILD_NAME:-}" ]; then
            case "$BUILD_NAME" in *[!0-9.]*) echo "::error::build_name must look like 1.2.3"; exit 1 ;; esac
            args+=("--build-name=$BUILD_NAME")
          fi
          flutter build ios --release --no-codesign "${args[@]}"

      # Xcode signs with the team's distribution certificate, creating it and
      # the App Store profile on first use, authorised by the API key.
      - name: Archive and sign
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded. It appears in App Store Connect > TestFlight once Apple has processed it (usually 10–30 minutes)."

      # Runs even when an earlier step failed, so the key never outlives the job.
      - name: Remove the API key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          echo "API key removed."
