name: Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health
        run: |
          curl -s -m 60 https://kiplstpsrinagar.com/api/v1/health || true
          curl -s -m 60 https://kipl-projectos.onrender.com/api/v1/health || true
