name: Mobile

# Builds the Flutter app on a runner that has the Android SDK preinstalled, so
# a debug APK can be produced without any local Android tooling. The APK is
# uploaded as a build artifact and can be installed straight onto a phone for
# site testing.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  android:
    runs-on: ubuntu-latest
    # A hung SDK download should fail fast rather than hold a runner for hours.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Android Gradle Plugin 8.x requires JDK 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Flutter SDK is fetched directly from Google's release bucket rather
      # than through a setup action: it is one pinned tarball, so there is no
      # version resolution or cache restore that can stall the job.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "Downloading $url"
          curl -fsSL --retry 3 --retry-delay 5 -o flutter.tar.xz "$url"
          tar xf flutter.tar.xz
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          git config --global --add safe.directory "${{ runner.temp }}/flutter"
          flutter --disable-analytics
          flutter --version

      - run: flutter pub get

      # Fails the build on errors and warnings; the remaining prefer_const
      # hints are infos and do not fail.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # The step that actually proves the Gradle config: manifest merge,
      # applicationId, signing fallback and plugin resolution all run here.
      #
      # API_BASE_URL is a repository VARIABLE (Settings > Secrets and variables
      # > Actions > Variables), not a secret — it is a public hostname, and a
      # variable can be read back to check what a build was pointed at. Without
      # it the app falls back to the address compiled into api_client.dart,
      # which is the KIPL website rather than the API, so every sign-in fails
      # with a 405 until each device is reconfigured by hand.
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${API_BASE_URL:-}" ]; then
            echo "Building against $API_BASE_URL"
            args+=("--dart-define=KIPL_API_BASE_URL=$API_BASE_URL")
          else
            echo "::warning::Repository variable API_BASE_URL is not set. The APK will use the built-in default endpoint, which is the website and not the API."
          fi
          flutter build apk --debug "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: kipl-projectos-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
