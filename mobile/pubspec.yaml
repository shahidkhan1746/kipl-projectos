name: kipl_projectos
description: KIPL ProjectOS — Field Operations Mobile App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # GPS / Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Camera / Image picker
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1

  # Offline storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # UI
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Utils
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
