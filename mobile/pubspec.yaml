name: kipl_projectos
description: KIPL ProjectOS — Field Operations Mobile App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # GPS / Location
  geolocator: ^11.0.0

  # Camera / Image picker
  image_picker: ^1.1.1

  # Formatting & UI
  intl: ^0.19.0

  # Utils
  url_launcher: ^6.3.0

  # Connectivity
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
